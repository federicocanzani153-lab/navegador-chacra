<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Ing. Agr. Federico Canzani">
<title>Obratel SA · Navegador de chacra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../app.css?v=5">
</head>
<body>
<div id="map"></div>
<div class="badge" id="badge" hidden></div>
<div class="pan" id="pan">
 <header><div class="tit"><b id="tit">Navegador de chacra</b><small id="subt"></small><small class="firma">Ing. Agr. Federico Canzani</small></div><button id="minb" aria-label="Minimizar">–</button></header>
 <div class="cuerpo">
  <div class="est" id="est">Cargando…</div>
  <div id="campoBox" hidden><div class="t">Campo</div><select id="campoSel"></select></div>
  <div class="t">Fecha</div>
  <div class="fila" id="fechas"></div>
  <div class="t">Capas</div>
  <label class="ck"><input type="checkbox" id="cReal"> Imagen real</label>
  <label class="ck"><input type="checkbox" id="cNdvi" checked> NDVI</label>
  <label class="ck"><input type="checkbox" id="cZon"> Zonas NDVI (3)</label>
  <label class="ck"><input type="checkbox" id="cLot" checked> Límites de lotes</label>
  <div class="t">Transparencia</div>
  <input type="range" id="op" min="0.2" max="1" step="0.05" value="0.9">
  <div id="lotsBox"><div class="t">Lotes</div><div class="fila" id="lots"></div></div>
  <div id="leyN"><div class="leg"></div><div class="legv"><span id="lmin"></span><span>NDVI</span><span id="lmax"></span></div></div>
  <div class="zl" id="leyZ" hidden><span><i style="background:#2e7d32"></i>Alta</span><span><i style="background:#fdd835"></i>Media</span><span><i style="background:#d7301f"></i>Baja</span></div>
  <div class="t" style="margin-top:10px">NDVI medio por lote</div>
  <div id="tab"></div>
  <div class="t" style="margin-top:10px">Búsqueda</div>
  <div class="fila" style="align-items:center">
   <span>Mín. sin nubes</span><input id="minc" type="number" min="50" max="100" value="95" style="width:64px;font-size:16px;padding:6px">%
   <button class="b" id="rebus">Buscar</button>
  </div>
  <small class="n">Sentinel-2 L2A. Muestra las 2 últimas fechas con el % de los lotes sin nubes pedido. Tocá el mapa para ver el NDVI del punto.</small>
 </div>
</div>
<div class="gps"><button id="bGps" title="GPS">📍</button><button id="bCen" title="Centrar en mí" hidden>◎</button></div>
<script>window.NAV = {datos: ["../data/obratel.json"]};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="../app.js?v=5"></script>
</body>
</html>
